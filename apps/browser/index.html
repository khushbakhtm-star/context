<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="color-scheme" content="light dark"><title>Context</title><link rel="stylesheet" href="./app.css"><script src="https://accounts.google.com/gsi/client" async defer></script><script src="./app.js" defer></script></head>
<body><header><button id="menu" aria-label="Open menu" title="Menu">☰</button><button id="previous" aria-label="Previous dates">‹</button><button id="now" class="binder" aria-label="Go to the current minute. Double-click for views; hold to choose dates."><span id="month"></span><strong id="date"></strong></button><button id="next" aria-label="Next dates">›</button><button id="undo" aria-label="Undo last edit" title="Undo" disabled>↶</button><button id="sync" aria-label="Synchronize private ledger. Hold for details." title="Sync. Hold or press Shift+F10 for details.">⇄<small id="sync-warning" hidden>!</small></button></header>
<div id="status" role="status" aria-live="polite">Connect Google and unlock the same private ledger you use on your phone.</div>
<main id="main"><section id="welcome"><img src="./context-app-logo.png" alt="Context" width="96" height="96"><h1>Context</h1><p>Your minutes, together on your phone and this browser.</p><button id="start">Connect Google</button></section><div id="grid" role="grid" aria-label="Minute ledger" hidden></div></main>
<section id="entry-bar" class="bottom-bar" aria-label="Minute text entry" hidden><textarea id="minute-entry" aria-label="Minute text" rows="2" maxlength="50000"></textarea><button id="save-text" aria-label="Save minute text">✓</button></section>
<section id="format-bar" class="bottom-bar" aria-label="Selected cell formatting" hidden><button id="format-bold" aria-label="Bold" aria-pressed="false"><b>B</b></button><button id="format-italic" aria-label="Italic" aria-pressed="false"><i>I</i></button><button id="format-underline" aria-label="Underline" aria-pressed="false"><u>U</u></button><button id="format-text-color" aria-label="Text color"><span class="text-color-mark">A</span></button><button id="format-fill" aria-label="Cell fill"><span id="fill-mark" class="fill-mark"></span></button><button id="finish-format" aria-label="Finish formatting">✓</button></section>
<div id="cell-menu" role="menu" aria-label="Cell actions" hidden></div>
<dialog id="text-color-dialog"><form method="dialog"><div class="dialog-heading"><h2>Text color</h2><button aria-label="Close text colors">×</button></div></form><label>Color<input id="text-color" type="color" value="#242424"></label><button id="apply-text-color">Apply</button></dialog>
<dialog id="fill-dialog"><form method="dialog"><div class="dialog-heading"><h2>Cell fill</h2><button aria-label="Close cell colors">×</button></div></form><div id="fill-colors" class="swatches"></div><button id="reset-fill">Reset</button><button id="load-fill-colors">Load Google Calendar colors</button></dialog>
<dialog id="group-dialog"><form method="dialog"><div class="dialog-heading"><h2>Group</h2><button aria-label="Close grouping">×</button></div></form><form id="group-form"><label>Activity title<input id="group-title" maxlength="200" required></label><button type="submit">Group</button></form></dialog>
<dialog id="menu-dialog"><form method="dialog"><div class="dialog-heading"><h2>Context</h2><button aria-label="Close menu">×</button></div></form><div class="menu-items"><button id="settings">Settings</button><button id="editing-info">Editing <span class="info" aria-hidden="true">i</span></button></div></dialog>
<dialog id="options"><form method="dialog"><div class="dialog-heading"><h2>Settings</h2><button aria-label="Close settings">×</button></div></form><p id="identity">No Google account connected</p><div class="controls"><button id="connect">Connect Google</button><button id="lock">Lock</button></div><form id="unlock-form"><label>Ledger passphrase <button type="button" id="passphrase-info" class="info" aria-label="About the ledger passphrase">i</button><input id="passphrase" type="password" autocomplete="off" minlength="12" maxlength="1024" required></label><button id="unlock" type="submit">Unlock and synchronize</button></form><hr><div class="controls"><button id="connect-calendars">Connect calendars</button><button id="calendar-info" class="info" aria-label="About calendar access">i</button></div><div id="calendars"></div><hr><label>Appearance<select id="appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Time format<select id="clock"><option value="12">12 hour (AM/PM)</option><option value="24">24 hour</option></select></label><button id="conflicts">Review other note versions</button></dialog>
<dialog id="view-dialog"><form method="dialog"><div class="dialog-heading"><h2>View</h2><button aria-label="Close views">×</button></div></form><div class="menu-items"><button data-days="1">Day</button><button data-days="3">3 days</button><button data-days="7">Week</button></div></dialog>
<dialog id="date-dialog"><form method="dialog"><div class="dialog-heading"><h2>Choose dates</h2><button aria-label="Close dates">×</button></div></form><label>Start date<input id="day" type="date" aria-label="Displayed date"></label><label>Days<select id="days" aria-label="Displayed days"><option value="1">1</option><option value="3">3</option><option value="7">7</option></select></label><button id="apply-dates">Show dates</button></dialog>
<dialog id="info-dialog"><form method="dialog"><div class="dialog-heading"><h2 id="info-title">Information</h2><button aria-label="Close information">×</button></div></form><p id="info-text" class="explanation"></p></dialog>
<dialog id="conflict-dialog"><form method="dialog"><div class="dialog-heading"><h2>Other note versions</h2><button aria-label="Close note versions">×</button></div></form><div id="conflict-list"></div></dialog>
</body></html>
