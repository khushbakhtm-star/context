AutoName: Context
Summary: Capture your day minute by minute alongside your calendars
Description: |-
  Record activities, thoughts, and decisions in a minute-by-minute ledger. Use
  custom activity categories and review time totals by day, week, month, or year.

  Connect calendars available through Android and choose which confirmed
  activities to synchronize. Calendar and storage permissions are optional.
  Private ledger synchronization is available through a user-selected HTTPS
  WebDAV folder. Optional Microsoft calendar and OneDrive support requires the
  publisher's configured Microsoft app registration and uses proprietary services.

  This edition omits Google's native sign-in SDK and the Expo development client.
  It does not provide direct Google account sign-in. Android calendar access can
  include calendars that another installed application makes available to Android.

RepoType: git
Repo: "https://github.com/khushbakhtm-star/context"

Builds:
  - versionName: 0.1.17
    versionCode: 18
    disable: Official F-Droid maintainer review, inclusion assessment, and server-toolchain approval are pending
    commit: 9fb9d951d1757631aa826f5cc132de8e7dfe4c30
    subdir: apps/mobile
    sudo:
      - apt-get update
      - apt-get install -y curl unzip xz-utils openjdk-17-jdk-headless
      - mkdir -p /opt/context-fdroid/node24
      - curl --fail --location https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz -o /tmp/context-node.tar.xz
      - echo '14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647 /tmp/context-node.tar.xz' | sha256sum --check -
      - tar -xJf /tmp/context-node.tar.xz --strip-components=1 -C /opt/context-fdroid/node24
      - PATH=/opt/context-fdroid/node24/bin:$PATH /opt/context-fdroid/node24/bin/npm install --global --prefix /opt/context-fdroid/node24 corepack@0.36.0
      - PATH=/opt/context-fdroid/node24/bin:$PATH /opt/context-fdroid/node24/bin/corepack enable --install-directory /opt/context-fdroid/node24/bin
      - PATH=/opt/context-fdroid/node24/bin:$PATH /opt/context-fdroid/node24/bin/corepack prepare pnpm@11.25.0 --activate
      - for tool in node npm npx corepack pnpm pnpx; do ln -sf /opt/context-fdroid/node24/bin/$tool /usr/local/bin/$tool; done
      - curl --fail --location https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o /tmp/context-gradle.zip
      - echo '2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb /tmp/context-gradle.zip' | sha256sum --check -
      - unzip -qo /tmp/context-gradle.zip -d /opt/context-fdroid
      - ln -sf /opt/context-fdroid/gradle-9.4.1/bin/gradle /usr/local/bin/gradle
    ndk: 27.1.12297006
    init:
      - EXPO_PUBLIC_CONTEXT_DISTRIBUTION=fdroid CONTEXT_FDROID_SOURCE_BUILD=1 node scripts/prepare-fdroid.cjs --apply
      - corepack pnpm install --prod --frozen-lockfile --ignore-scripts
      - EXPO_PUBLIC_CONTEXT_DISTRIBUTION=fdroid CONTEXT_FDROID_SOURCE_BUILD=1 corepack pnpm exec expo prebuild --platform android --no-install
      - EXPO_PUBLIC_CONTEXT_DISTRIBUTION=fdroid CONTEXT_FDROID_SOURCE_BUILD=1 node scripts/prepare-fdroid.cjs --unsigned-android
    # Official Hermes compiler exception only; input hash and source are checked by preparation.
    # See apps/mobile/fdroid/HERMES_COMPILER.md. No directory-wide scanner exclusion.
    scanignore:
      - apps/mobile/node_modules/.pnpm/hermes-compiler@260318099.0.4/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
    build:
      - cd android && EXPO_PUBLIC_CONTEXT_DISTRIBUTION=fdroid gradle --no-daemon assembleRelease
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk

